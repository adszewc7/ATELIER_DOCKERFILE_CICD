name: Atelier CI/CD

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: atelier-flask

jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Lancer les tests
        run: pytest -v tests

  Docker:
    runs-on: ubuntu-latest
    needs: Tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Exporter l'image dans un fichier
        run: docker save $IMAGE_NAME:${{ github.sha }} -o image.tar

      - name: Transmettre l'image au job suivant
        uses: actions/upload-artifact@v4
        with:
          name: image-docker
          path: image.tar

  Production:
    runs-on: ubuntu-latest
    needs: Docker
    environment: production
    steps:
      - name: Récupérer l'image du job 2
        uses: actions/download-artifact@v4
        with:
          name: image-docker

      - name: Charger l'image dans Docker
        run: docker load -i image.tar

      - name: Démarrer le conteneur
        run: docker run -d --name app -p 4000:4000 $IMAGE_NAME:${{ github.sha }}

      - name: Vérifier que l'application répond
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:4000/

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker logs app

      - name: Résumé du déploiement
        run: |
          echo "## ✅ Déploiement réussi" >> $GITHUB_STEP_SUMMARY
          echo "Image : \`$IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "L'application répond sur http://localhost:4000/" >> $GITHUB_STEP_SUMMARY
